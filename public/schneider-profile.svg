<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Yellow Background Canvas -->
  <rect width="400" height="400" fill="#FFDE59"/>
  
  <!-- Outer Thick Black Border -->
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#000000" stroke-width="12"/>

  <!-- Geometric Halftone Background Pattern -->
  <circle cx="60" cy="60" r="15" fill="#000000"/>
  <circle cx="100" cy="60" r="15" fill="#FF0055"/>
  <circle cx="60" cy="100" r="15" fill="#00F0FF"/>
  <circle cx="340" cy="340" r="20" fill="#000000"/>
  <circle cx="300" cy="340" r="12" fill="#FF0055"/>

  <!-- Character / Avatar Silhouette (Neo-Brutalist Vibe Coder) -->
  <g stroke="#000000" stroke-width="8" fill="#FFFFFF">
    <!-- Sunglasses / Glasses -->
    <rect x="100" y="140" width="90" height="60" fill="#000000"/>
    <rect x="210" y="140" width="90" height="60" fill="#000000"/>
    <line x1="190" y1="160" x2="210" y2="160" stroke="#000000" stroke-width="10"/>

    <!-- Reflection highlights on glasses -->
    <polygon points="110,150 140,150 120,180 110,180" fill="#00F0FF" stroke="none"/>
    <polygon points="220,150 250,150 230,180 220,180" fill="#00F0FF" stroke="none"/>

    <!-- Hoody / Collar -->
    <path d="M 60,380 L 120,280 L 280,280 L 340,380 Z" fill="#000000"/>
    <polygon points="160,280 200,340 240,280" fill="#FF0055"/>
  </g>

  <!-- Big Bold Text Badge -->
  <rect x="40" y="40" width="140" height="36" fill="#FF0055" stroke="#000000" stroke-width="4"/>
  <text x="110" y="65" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">SCHNEIDER</text>

  <!-- Code Tag -->
  <rect x="220" y="320" width="140" height="36" fill="#00F0FF" stroke="#000000" stroke-width="4"/>
  <text x="290" y="344" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#000000" text-anchor="middle">&lt;VIBE/&gt;</text>
</svg>